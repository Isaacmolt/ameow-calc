<style>
:root {
  --cream: #FDF6EE;
  --cream-dark: #F0E4D4;
  --butter: #F2D8A7;
  --butter-deep: #E8C88A;
  --caramel: #B8896A;
  --mocha: #8B6F5E;
  --dark: #4A3728;
  --white: #FFFCF8;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:'Noto Sans TC',sans-serif;
  background:var(--cream);
  color:var(--dark);
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-weight:300;
  position:relative;
}

body::before {
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;
}

.app {
  height:100vh; height:100dvh;
  max-width:480px; margin:0 auto;
  display:flex; flex-direction:column;
  position:relative; z-index:1;
  padding:0 16px;
}

header {
  text-align:center;
  padding:calc(14px + env(safe-area-inset-top)) 0 8px;
  flex-shrink:0;
}
.logo { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; color:var(--mocha); letter-spacing:2px; }
.logo-line { width:40px; height:2px; background:linear-gradient(90deg,var(--butter),var(--caramel)); margin:6px auto 0; border-radius:2px; }

/* Mode toggle: 戚風蛋糕 / 內餡 */
.mode-toggle {
  display:inline-flex; margin:10px auto 0;
  background:var(--cream-dark); border-radius:12px; padding:3px; gap:2px;
}
.mode-btn {
  padding:7px 22px; border:none; border-radius:10px;
  background:transparent; color:var(--mocha);
  font-family:'Noto Sans TC',sans-serif; font-size:13px; font-weight:400;
  cursor:pointer; transition:all 0.2s;
}
.mode-btn.active { background:var(--white); color:var(--dark); font-weight:500; box-shadow:0 1px 6px rgba(74,55,40,0.12); }

/* Builder */
.builder {
  flex-shrink:0;
  background:var(--white);
  border-radius:14px;
  box-shadow:0 2px 16px rgba(74,55,40,0.08);
  padding:12px;
  margin-bottom:10px;
}

.builder-row { display:flex; gap:8px; align-items:center; }

.select-wrap { flex:1; position:relative; }

.select-wrap select {
  width:100%;
  padding:10px 32px 10px 12px;
  border:1.5px solid var(--cream-dark);
  border-radius:10px;
  background:var(--cream);
  font-family:'Noto Sans TC',sans-serif;
  font-size:14px; font-weight:400; color:var(--dark);
  appearance:none; cursor:pointer;
  transition:border-color 0.2s;
}
.select-wrap select:focus { outline:none; border-color:var(--butter-deep); }
.select-wrap::after { content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--caramel); pointer-events:none; }

.size-pills { display:flex; gap:4px; flex-shrink:0; }

.size-pill {
  padding:10px 14px;
  border:1.5px solid var(--cream-dark);
  border-radius:10px;
  background:var(--cream);
  font-family:'Noto Sans TC',sans-serif;
  font-size:13px; font-weight:400; color:var(--mocha);
  cursor:pointer; transition:all 0.2s;
}
.size-pill.active { background:var(--butter); border-color:var(--butter-deep); color:var(--dark); font-weight:500; }

.builder-row2 { display:flex; gap:8px; align-items:center; margin-top:8px; }

.qty-row {
  display:flex; align-items:center; gap:4px;
  background:var(--cream); border:1.5px solid var(--cream-dark);
  border-radius:10px; padding:2px; flex:1;
}

.qty-btn {
  width:36px; height:36px;
  border:none; background:none;
  font-size:20px; color:var(--mocha);
  cursor:pointer; border-radius:8px;
  font-family:'Noto Sans TC',sans-serif;
  transition:background 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.qty-btn:active { background:var(--butter); }

.qty-num { flex:1; text-align:center; font-size:16px; font-weight:500; color:var(--dark); }

.add-btn {
  padding:10px 20px; border:none; border-radius:10px;
  background:var(--dark); color:var(--white);
  font-family:'Noto Sans TC',sans-serif;
  font-size:14px; font-weight:500; cursor:pointer;
  transition:all 0.2s; letter-spacing:1px; flex-shrink:0;
}
.add-btn:active { transform:scale(0.96); opacity:0.9; }

/* Order tags */
.order-area { flex-shrink:0; min-height:36px; margin-bottom:10px; }

.order-tags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }

.order-tag {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--white); border:1px solid var(--cream-dark);
  border-radius:20px; padding:5px 8px 5px 12px;
  font-size:12px; color:var(--dark); font-weight:400;
  animation:popIn 0.25s ease-out;
}
.order-tag .tag-x {
  width:18px;height:18px; border:none; background:var(--cream);
  border-radius:50%; font-size:11px; color:var(--caramel);
  cursor:pointer; display:flex;align-items:center;justify-content:center;
  font-family:'Noto Sans TC',sans-serif;
}
.order-tag .tag-x:active { background:var(--cream-dark); }

.clear-all {
  font-size:11px; color:var(--caramel); background:none;
  border:1px dashed var(--cream-dark); border-radius:20px;
  padding:5px 12px; cursor:pointer; font-family:'Noto Sans TC',sans-serif;
}
.clear-all:active { background:var(--cream); }

.empty-hint { text-align:center; font-size:12px; color:var(--caramel); padding:6px 0; }

/* Result */
.result-area {
  flex:1; background:var(--white);
  border-radius:14px 14px 0 0;
  box-shadow:0 -2px 20px rgba(74,55,40,0.08);
  display:flex; flex-direction:column;
  overflow:hidden; min-height:0;
}

.result-header {
  padding:12px 16px 8px; font-size:13px; font-weight:500; color:var(--mocha);
  flex-shrink:0; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--cream);
}

.result-badge {
  background:var(--butter); color:var(--dark);
  font-size:11px; font-weight:500; padding:2px 8px; border-radius:20px;
}

.result-scroll {
  flex:1; overflow-y:auto; padding:8px 12px calc(20px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}

.result-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }

.group-block { margin-bottom:14px; transition:opacity 0.3s; }
.group-block:last-child { margin-bottom:0; }
.group-block.done { opacity:0.35; }
.group-block.done .group-title { text-decoration:line-through; }
.group-title {
  font-size:13px; font-weight:500; color:var(--mocha);
  margin-bottom:8px; display:flex; align-items:center; gap:8px;
  cursor:pointer;
}
.group-check {
  width:20px; height:20px; border-radius:6px;
  border:1.5px solid var(--cream-dark); background:var(--white);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all 0.2s;
  font-size:12px; color:transparent;
}
.group-block.done .group-check {
  background:var(--caramel); border-color:var(--caramel); color:var(--white);
}
.group-sizes {
  font-size:11px; font-weight:400; color:var(--caramel);
  background:var(--cream); padding:2px 8px; border-radius:10px;
}

.r-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 12px; background:var(--cream); border-radius:10px;
}
.r-name { font-size:13px; color:var(--dark); font-weight:400; }
.r-note { font-size:11px; color:var(--caramel); font-weight:400; margin-right:3px; }
.r-cream-b { background:#F0D6DC; border:1.5px solid #DBBEC6; }
.r-cream-b .r-name { font-weight:500; color:var(--dark); }
.r-gelatin { background:#E8E0D4; border:1.5px solid #D4C9BB; }
.r-gelatin .r-name { font-weight:500; color:var(--dark); }
.r-amt { font-family:'Noto Sans TC',sans-serif; font-size:17px; font-weight:700; color:var(--dark); }
.r-unit { font-family:'Noto Sans TC',sans-serif; font-size:11px; font-weight:300; color:var(--caramel); margin-left:1px; }

.result-empty { text-align:center; padding:30px 0; font-size:13px; color:var(--caramel); font-weight:300; }

/* Overview button */
.overview-btn {
  margin-left:auto;
  padding:4px 14px;
  border:1.5px solid var(--cream-dark);
  border-radius:20px;
  background:var(--white);
  font-family:'Noto Sans TC',sans-serif;
  font-size:12px; font-weight:500; color:var(--mocha);
  cursor:pointer; transition:all 0.2s;
}
.overview-btn:active { background:var(--cream); }

/* Fullscreen overview mode */
.result-area.overview {
  position:fixed; inset:0; z-index:999;
  border-radius:0;
  background:var(--white);
}
.result-area.overview .result-header {
  padding:calc(16px + env(safe-area-inset-top)) 20px 10px;
}
.result-area.overview .overview-btn {
  background:var(--dark); color:var(--white); border-color:var(--dark);
}
.result-area.overview .result-scroll {
  padding:8px 16px calc(30px + env(safe-area-inset-bottom));
}
.result-area.overview .result-grid {
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
}
.result-area.overview .r-item {
  padding:7px 10px;
}
.result-area.overview .r-name { font-size:11px; }
.result-area.overview .r-amt { font-size:15px; }
.result-area.overview .r-unit { font-size:10px; }
.result-area.overview .r-note { font-size:9px; }
.result-area.overview .group-block { margin-bottom:10px; }
.result-area.overview .group-title { font-size:12px; margin-bottom:5px; }
.result-area.overview .group-sizes { font-size:10px; }
.result-area.overview .group-check { width:18px; height:18px; font-size:10px; }

@keyframes popIn { from{opacity:0;transform:scale(0.85)} to{opacity:1;transform:scale(1)} }
@media (prefers-reduced-motion: reduce) { .order-tag { animation:none; } .group-block, .size-pill, .add-btn, .overview-btn, .mode-btn { transition:none; } }

.result-scroll::-webkit-scrollbar { width:3px; }
.result-scroll::-webkit-scrollbar-track { background:transparent; }
.result-scroll::-webkit-scrollbar-thumb { background:var(--cream-dark); border-radius:3px; }
</style>

// 戚風蛋糕（與內餡分開計算）
const chiffonRecipes = {
  "原味戚風": { cat:"戚風", flavor:"原味", sizes:{ "4吋":{"低筋麵粉":20,"沙拉油":10,"牛奶":12,"蛋黃":17,"砂糖":15,"蛋白":37}, "6吋":{"低筋麵粉":60,"沙拉油":30,"牛奶":36,"蛋黃":51,"砂糖":45,"蛋白":110} }},
  "茶味戚風（金萱）": { cat:"戚風", flavor:"金萱", sizes:{ "4吋":{"低筋麵粉":17,"金萱茶粉":2,"沙拉油":10,"牛奶":16,"蛋黃":17,"砂糖":15,"蛋白":37}, "6吋":{"低筋麵粉":50,"金萱茶粉":4,"沙拉油":30,"牛奶":50,"蛋黃":52,"砂糖":45,"蛋白":110} }},
  "茶味戚風（鐵觀音）": { cat:"戚風", flavor:"鐵觀音", sizes:{ "4吋":{"低筋麵粉":17,"鐵觀音茶粉":2,"沙拉油":10,"牛奶":16,"蛋黃":17,"砂糖":15,"蛋白":37}, "6吋":{"低筋麵粉":50,"鐵觀音茶粉":4,"沙拉油":30,"牛奶":50,"蛋黃":52,"砂糖":45,"蛋白":110} }},
  "茶味戚風（伯爵）": { cat:"戚風", flavor:"伯爵", sizes:{ "4吋":{"低筋麵粉":17,"伯爵茶粉":2,"沙拉油":10,"牛奶":16,"蛋黃":17,"砂糖":15,"蛋白":37}, "6吋":{"低筋麵粉":50,"伯爵茶粉":4,"沙拉油":30,"牛奶":50,"蛋黃":52,"砂糖":45,"蛋白":110} }},
  "茶味戚風（焙茶）": { cat:"戚風", flavor:"焙茶", sizes:{ "4吋":{"低筋麵粉":17,"焙茶茶粉":2,"沙拉油":10,"牛奶":16,"蛋黃":17,"砂糖":15,"蛋白":37}, "6吋":{"低筋麵粉":50,"焙茶茶粉":4,"沙拉油":30,"牛奶":50,"蛋黃":52,"砂糖":45,"蛋白":110} }}
};

// 兩個模式各自獨立的配方、材料顯示順序、品項清單與勾選狀態
const modes={
  filling:{ recipes, ord:["吉利丁","鮮奶油","牛奶","砂糖","糖","白巧克力","巧克力","可可粉","金萱茶粉","鐵觀音茶粉","伯爵茶粉","焙茶茶粉","香草籽醬","紅茶包","B鮮奶油"], orders:[], doneGroups:new Set() },
  chiffon:{ recipes:chiffonRecipes, ord:["低筋麵粉","金萱茶粉","鐵觀音茶粉","伯爵茶粉","焙茶茶粉","沙拉油","牛奶","蛋黃","砂糖","蛋白"], orders:[], doneGroups:new Set() }
};
let mode='filling';
let currentSize="4吋", currentQty=1, oid=0;
let orders=modes[mode].orders;          // 永遠指向目前模式的陣列（只做原地修改，不重新指派）
let doneGroups=modes[mode].doneGroups;  // 已勾選完成的口味，重新渲染後保留
function R(){return modes[mode].recipes;}
// 備料順序：原味奶凍 → 原味戚風 → 香草奶油類 → 紅茶奶凍 → 可可奶凍 → 茶類
const flavorOrder=["原味奶凍","原味","香草","紅茶","可可","金萱","鐵觀音","伯爵","焙茶"];
function flavorRank(f){const i=flavorOrder.indexOf(f);return i===-1?99:i;}
function orderSortKey(o){return [flavorRank(R()[o.name].flavor), Object.keys(R()).indexOf(o.name), o.size==="4吋"?0:1];}

function setMode(m){
  if(!modes[m]) return;
  mode=m; orders=modes[m].orders; doneGroups=modes[m].doneGroups;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  currentQty=1;document.getElementById('qtyNum').textContent=1;
  initSelect();renderOrders();renderResult();
  try{localStorage.setItem('ameow-mode',m);}catch(e){}
}
function sortOrders(){
  orders.sort((a,b)=>{const ka=orderSortKey(a),kb=orderSortKey(b);for(let i=0;i<ka.length;i++){if(ka[i]!==kb[i])return ka[i]-kb[i];}return a.id-b.id;});
}

function initSelect(){
  const sel=document.getElementById('cakeSelect');
  let cat='',html='';
  Object.entries(R()).forEach(([n,r])=>{
    if(r.cat!==cat){if(cat)html+='</optgroup>';cat=r.cat;html+=`<optgroup label="── ${r.cat} ──">`;}
    html+=`<option value="${n}">${n}</option>`;
  });
  html+='</optgroup>';
  sel.innerHTML=html;
}

function pickSize(btn){
  document.querySelectorAll('.size-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSize=btn.dataset.size;
}

function adjQty(d){
  currentQty=Math.max(1,Math.min(99,currentQty+d));
  document.getElementById('qtyNum').textContent=currentQty;
}

function addOrder(){
  const name=document.getElementById('cakeSelect').value;
  const existing=orders.find(o=>o.name===name&&o.size===currentSize);
  if(existing) existing.qty=Math.min(99,existing.qty+currentQty); // 同款同尺寸合併數量
  else orders.push({id:++oid,name,size:currentSize,qty:currentQty});
  sortOrders();
  currentQty=1;document.getElementById('qtyNum').textContent=1;
  renderOrders();renderResult();
}

function removeOrder(id){const i=orders.findIndex(o=>o.id===id);if(i>-1)orders.splice(i,1);renderOrders();renderResult();}
function clearAll(){orders.length=0;doneGroups.clear();renderOrders();renderResult();}
function toggleGroup(el){
  const blk=el.parentElement;
  blk.classList.toggle('done');
  const f=blk.dataset.flavor;
  if(blk.classList.contains('done')) doneGroups.add(f); else doneGroups.delete(f);
}
function toggleOverview(){
  const area=document.getElementById('resultArea');
  area.classList.toggle('overview');
  const btn=document.getElementById('overviewBtn');
  btn.textContent=area.classList.contains('overview')?'返回':'總覽';
}

function renderOrders(){
  const area=document.getElementById('orderArea');
  if(!orders.length){area.innerHTML='<div class="empty-hint">選擇款式 → 尺寸 → 數量 → 加入</div>';return;}
  area.innerHTML=`<div class="order-tags">${orders.map(o=>
    `<span class="order-tag">${o.name} ${o.size}×${o.qty}<button class="tag-x" onclick="removeOrder(${o.id})">✕</button></span>`
  ).join('')}<button class="clear-all" onclick="clearAll()">清除全部</button></div>`;
}

function renderResult(){
  const content=document.getElementById('resultContent');
  const badge=document.getElementById('totalBadge');
  if(!orders.length){badge.textContent='0 項';content.innerHTML='<div class="result-empty">尚未加入任何品項</div>';return;}

  // Group orders by flavor
  const groups={};
  orders.forEach(o=>{
    const flavor=R()[o.name].flavor;
    if(!groups[flavor]) groups[flavor]=[];
    groups[flavor].push(o);
  });

  const unitMap={"紅茶包":"包","吉利丁":"片","巧克力":"g"};
  const ord=modes[mode].ord;

  // Sort flavors by prep priority
  const groupNames=Object.keys(groups).sort((a,b)=>flavorRank(a)-flavorRank(b));
  // 只保留目前仍存在的口味勾選狀態
  [...doneGroups].forEach(f=>{ if(!groups[f]) doneGroups.delete(f); });
  badge.textContent=`${groupNames.length} 品項`;

  let html='';
  groupNames.forEach(flavor=>{
    const items=groups[flavor];
    // Merge same name+size by summing qty
    const merged={};
    const order=[];
    items.forEach(o=>{
      let short=o.name.replace(/（.+?）/,'').replace(flavor,'').trim();
      if(!short) short=o.name; // 例如「原味奶凍」名稱即口味，避免標籤留空
      const key=short+'|'+o.size;
      if(!merged[key]){merged[key]={short,size:o.size,qty:0};order.push(key);}
      merged[key].qty+=o.qty;
    });
    const label=order.map(k=>{
      const m=merged[k];
      return`${m.short}${m.size}×${m.qty}`;
    }).join(' + ');

    // Sum ingredients within this group
    const totals={};
    const pieceCounts={};
    const gelatinFrac={num:0,den:3}; // track gelatin as thirds
    let hasGelatin=false;
    items.forEach(o=>{
      const ings=R()[o.name].sizes[o.size];
      Object.entries(ings).forEach(([k,v])=>{
        if(Array.isArray(v)){
          // Gelatin: [whole, numerator, denominator]
          hasGelatin=true;
          const thirds=(v[0]*v[2]+v[1])*o.qty;
          gelatinFrac.num+=thirds;
        } else if(typeof v==='string'){
          const match=v.match(/\((\d+)個\)\s*([\d.]+)/);
          if(match){
            pieceCounts[k]=(pieceCounts[k]||0)+parseInt(match[1])*o.qty;
            totals[k]=(totals[k]||0)+parseFloat(match[2])*o.qty;
          }
        } else {
          totals[k]=(totals[k]||0)+v*o.qty;
        }
      });
    });
    // Convert gelatin fraction to display
    if(hasGelatin){
      const whole=Math.floor(gelatinFrac.num/gelatinFrac.den);
      const rem=gelatinFrac.num%gelatinFrac.den;
      let gelatinDisplay='';
      if(whole>0&&rem>0) gelatinDisplay=`${whole}又${rem}/${gelatinFrac.den}`;
      else if(whole>0) gelatinDisplay=`${whole}`;
      else if(rem>0) gelatinDisplay=`${rem}/${gelatinFrac.den}`;
      else gelatinDisplay='0';
      totals['吉利丁']=gelatinDisplay;
    }

    const entries=Object.entries(totals);
    entries.sort((a,b)=>{const ia=ord.indexOf(a[0]),ib=ord.indexOf(b[0]);return(ia===-1?99:ia)-(ib===-1?99:ib);});

    html+=`<div class="group-block${doneGroups.has(flavor)?' done':''}" data-flavor="${flavor}">`;
    html+=`<div class="group-title" onclick="toggleGroup(this)"><div class="group-check">✓</div>${flavor}<span class="group-sizes">${label}</span></div>`;
    html+=`<div class="result-grid">${entries.map(([ing,amt])=>{
      const unit=unitMap[ing]||'g';
      const cls=ing==='B鮮奶油'?'r-item r-cream-b':ing==='吉利丁'?'r-item r-gelatin':'r-item';
      const pieceNote=pieceCounts[ing]?`<span class="r-note">(${pieceCounts[ing]}個)</span>`:'';
      const isGelatin=ing==='吉利丁';
      const displayAmt=isGelatin?amt:(Number.isInteger(amt)?amt:parseFloat(amt.toFixed(2)));
      const unitText=isGelatin?'片':unit;
      return`<div class="${cls}"><span class="r-name">${ing}</span><span class="r-amt">${pieceNote}${displayAmt}<span class="r-unit">${unitText}</span></span></div>`;
    }).join('')}</div></div>`;
  });

  content.innerHTML=html;
}

(function(){let m='filling';try{m=localStorage.getItem('ameow-mode')||m;}catch(e){}setMode(modes[m]?m:'filling');})();
</script>
</body>
</html>
