<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link href="fonts-kr.css" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ec;
    --ink: #4a4540;
    --soft: #a39b90;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ddd; font-family: "Noto Sans TC", sans-serif; font-weight: 300; color: var(--ink); }
  .poster { width: 1080px; height: 1350px; background: var(--bg); position: relative; overflow: hidden; margin-bottom: 40px; }
  .photo { position: absolute; background-size: cover; background-position: center; }
  .kr { font-family: "Gowun Dodum", sans-serif; }
  .en { font-family: "Gowun Dodum", sans-serif; letter-spacing: .08em; text-transform: lowercase; }
  .hand { font-family: "LXGW WenKai TC", serif; }

  /* ---------- 01：圓角大圖＋底部小字 ---------- */
  #k1 .top { position: absolute; top: 90px; left: 0; right: 0; text-align: center; font-size: 24px; color: var(--soft); }
  #k1 .photo { left: 120px; top: 170px; width: 840px; height: 900px; border-radius: 28px;
    background-image: url(cake-1.jpg); background-position: 50% 42%; }
  #k1 .cap { position: absolute; top: 1150px; left: 0; right: 0; text-align: center; }
  #k1 .cap .kr { font-size: 34px; letter-spacing: .12em; }
  #k1 .cap .zh { font-size: 32px; letter-spacing: .2em; }

  /* ---------- 02：雙圖拼貼 ---------- */
  #k2 .a { left: 90px; top: 110px; width: 560px; height: 960px; border-radius: 20px;
    background-image: url(cake-3.jpg); background-position: 40% 50%; }
  #k2 .b { left: 680px; top: 560px; width: 310px; height: 510px; border-radius: 20px;
    background-image: url(cake-1.jpg); background-position: 50% 45%; }
  #k2 .side { position: absolute; left: 684px; top: 116px; }
  #k2 .side .en { font-size: 22px; color: var(--soft); line-height: 1.8; }
  #k2 .cap { position: absolute; left: 96px; top: 1135px; }
  #k2 .cap .hand { font-size: 40px; letter-spacing: .06em; }
  #k2 .cap .en { margin-top: 20px; font-size: 22px; color: var(--soft); }

  /* ---------- 03：拍立得 ---------- */
  #k3 .card { position: absolute; left: 170px; top: 150px; width: 740px; height: 930px; background: #fff;
    border-radius: 6px; transform: rotate(-2.5deg); box-shadow: 0 18px 40px rgba(80,60,40,.10), 0 2px 6px rgba(80,60,40,.06); }
  #k3 .card .photo { left: 36px; top: 36px; right: 36px; height: 740px; border-radius: 2px;
    background-image: url(cake-2.jpg); background-position: 40% 50%; }
  #k3 .card .hand { position: absolute; left: 50px; bottom: 50px; font-size: 38px; color: var(--ink); }
  #k3 .tape { position: absolute; left: 470px; top: 118px; width: 150px; height: 44px; background: rgba(214,224,196,.75); transform: rotate(3deg); }
  #k3 .foot { position: absolute; left: 0; right: 0; bottom: 110px; text-align: center; font-size: 22px; color: var(--soft); }
</style>
</head>
<body>

<section class="poster" id="k1">
  <div class="top en">ameow's food</div>
  <div class="photo"></div>
  <div class="cap">
    <div class="zh">今天是你的日子</div>
  </div>
</section>

<section class="poster" id="k2">
  <div class="photo a"></div>
  <div class="photo b"></div>
  <div class="side en">a little<br>green cake</div>
  <div class="cap">
    <div class="hand">慢慢來，生日快樂。</div>
    <div class="en">ameow's food</div>
  </div>
</section>

<section class="poster" id="k3">
  <div class="card">
    <div class="photo"></div>
    <div class="hand">被記得，就很甜 ♡</div>
  </div>
  <div class="tape"></div>
  <div class="foot en">ameow's food</div>
</section>

</body>
</html>
